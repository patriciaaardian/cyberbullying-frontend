<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cyberbullying Detector AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      outline: none;
      resize: none;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #334155;
    }

    .bullying {
      color: #ef4444;
    }

    .normal {
      color: #22c55e;
    }

    .joke {
      color: #facc15;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🧠 Cyberbullying Detector AI</h1>

  <textarea id="inputText" placeholder="Type your text here..."></textarea>

  <button onclick="checkText()">Detect</button>

  <div id="result" class="result">Result will appear here...</div>
</div>

<script>
async function checkText() {
  const text = document.getElementById("inputText").value;

  const res = await fetch("https://pat00-cyberbullying-detector.hf.space/predict", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  let colorClass = "";

  if (data.label === "cyberbullying") {
    colorClass = "bullying";
  } else if (data.label === "joke") {
    colorClass = "joke";
  } else {
    colorClass = "normal";
  }

  document.getElementById("result").innerHTML = `
    <div class="${colorClass}">
      <b>Result:</b> ${data.label} <br/>
      <b>Confidence:</b> ${data.confidence.toFixed(2)}
    </div>
  `;
}
</script>

</body>
</html>
