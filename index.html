<script>
async function checkText() {
  const text = document.getElementById("inputText").value;
  const resultDiv = document.getElementById("result");

  resultDiv.innerHTML = "Processing... ⏳";

  try {
    const res = await fetch("https://pat00-cyberbullying-detector.hf.space/predict", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text })
    });

    const data = await res.json();
    console.log("API RESPONSE:", data);

    // fleksibel parsing (biar gak error kalau beda key)
    const label = data.label || data.prediction || "unknown";
    const confidence = data.confidence || data.score || 0;

    let colorClass = "normal";

    if (label.toLowerCase().includes("cyber")) {
      colorClass = "bullying";
    } else if (label.toLowerCase().includes("joke")) {
      colorClass = "joke";
    }

    resultDiv.innerHTML = `
      <div class="${colorClass}">
        <b>Result:</b> ${label} <br/>
        <b>Confidence:</b> ${confidence}
      </div>
    `;

  } catch (err) {
    console.error(err);
    resultDiv.innerHTML = "Error connecting to API ❌";
  }
}
</script>
